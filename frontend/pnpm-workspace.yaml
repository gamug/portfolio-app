# The frontend is its own pnpm workspace root. reference/ has a separate OpenUI workspace that this
# project never installs.
packages: ["."]
onlyBuiltDependencies:
  - "@openuidev/lang-core"
  - esbuild
  - sharp
  - unrs-resolver
allowBuilds:
  "@openuidev/lang-core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@openuidev/*"
