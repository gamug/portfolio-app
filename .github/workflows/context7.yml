# Inherited from thesysdev/openui. Every job is guarded so that it never runs on this fork.
name: Refresh Context7 docs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    if: github.repository == 'thesysdev/openui'
    runs-on: ubuntu-latest
    steps:
      - id: refresh
        uses: rennf93/upsert-context7@1.1
        with:
          operation: refresh

      - name: Show result
        run: |
          echo "Success: ${{ steps.refresh.outputs.success }}"
          echo "Status: ${{ steps.refresh.outputs.status-code }}"
          echo "Message: ${{ steps.refresh.outputs.message }}"
