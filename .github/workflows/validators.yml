name: validators

# The project's quality gates, in the order fixed in config.yaml (quality.ci_gate_order).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  PNPM_VERSION: "10.33.0"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198" # linux x86_64
  # The project states that data leaves the machine only to GraphDB and DeepSeek: no dependency
  # or CLI telemetry (see README, "Privacy").
  DO_NOT_TRACK: "1"
  OPENUI_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"

      - name: Install dependencies
        run: uv sync --locked --directory backend && pnpm --dir frontend install --frozen-lockfile

      - name: gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks git --redact --no-banner --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            gitleaks dir . --redact --no-banner
          fi
      - name: ruff
        run: uv run --directory backend ruff check . && uv run --directory backend ruff format --check .
      - name: mypy
        run: uv run --directory backend mypy app
      - name: ESLint and Prettier
        run: pnpm --dir frontend lint && pnpm --dir frontend exec prettier --check .
      - name: tsc
        run: pnpm --dir frontend exec tsc --noEmit
      - name: pytest
        run: uv run --directory backend pytest
      - name: Vitest
        run: pnpm --dir frontend test --run

  # The commit-msg hook only runs where scripts/init.sh installed the git hooks (the devcontainer),
  # so CI checks every commit subject of the pull request as well. A squash merge uses the PR title:
  # give it the same format.
  commit-subjects:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit subjects ([FR][WI][TASK] suffix)
        run: |
          set -euo pipefail
          git log --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | python3 backend/app/devtools/check_commit_msg.py --stdin

  # Shell scripts are not covered by ruff or mypy. ShellCheck is pinned like the other tools
  # (same version and checksum as the devcontainer image), not taken from the runner image.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck
        run: |
          set -euo pipefail
          file="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${file}"
          echo "${SHELLCHECK_SHA256}  ${file}" | sha256sum -c -
          tar -xJf "${file}"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      - name: ShellCheck
        run: shellcheck scripts/*.sh
