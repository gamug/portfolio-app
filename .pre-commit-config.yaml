# Local quality gates. Hooks run the project's locked tools (see config.yaml and the constitution).
# Installed by scripts/init.sh.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: gitleaks-push
        name: gitleaks (secret scan of the working tree)
        entry: gitleaks dir . --redact --no-banner
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check .
        language: system
        pass_filenames: false
        files: ^backend/
      - id: ruff-format
        name: ruff format --check
        entry: uv run --directory backend ruff format --check .
        language: system
        pass_filenames: false
        files: ^backend/
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy app
        language: system
        pass_filenames: false
        files: ^backend/
      - id: eslint
        name: eslint
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: prettier
        name: prettier --check
        entry: pnpm --dir frontend exec prettier --check .
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: tsc
        name: tsc --noEmit
        entry: pnpm --dir frontend exec tsc --noEmit
        language: system
        pass_filenames: false
        files: ^frontend/
      - id: commit-message
        name: conventional commit with [FR][WI][TASK] suffix
        entry: python3 backend/app/devtools/check_commit_msg.py
        language: system
        stages: [commit-msg]
